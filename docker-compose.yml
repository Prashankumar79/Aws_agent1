# Compose file for the InfraSketch dependencies (DrawIO + Qdrant).
# The `version:` key was removed — Compose v2 ignores it and the spec recommends omitting it.
# Production hardening:
#   • Bind to 127.0.0.1 so ports are NOT exposed publicly.
#   • Drop all Linux capabilities and add only what's needed.
#   • Run as a non-root user where the upstream image supports it.
#   • Add healthchecks so `docker compose ps` reflects real readiness.
#   • Add resource limits to protect the host from runaway containers.
#   • Use `no-new-privileges` and `read_only: true` filesystem where possible.

services:
  backend:
    build:
      context: ./backend
    container_name: infrasketch-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - QDRANT_URL=http://qdrant:6333
      - API_KEY=this_is_my_super_secure_32_character_password_123456789
    expose:
      - "8000"
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
      - backend_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    container_name: infrasketch-frontend
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  drawio:
    image: jgraph/drawio:24.7.17
    container_name: infrasketch-drawio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"     # local-only by default
    environment:
      - DRAWIO_SELF_CONTAINED=1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"      # local-only REST
      - "127.0.0.1:6334:6334"      # local-only gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  backend_storage:
  backend_logs:
  backend_data:
  qdrant_storage:
