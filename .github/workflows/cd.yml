name: CD - Build & Deploy to GCP

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/terraform-generator

jobs:
  # ── Build & Push Backend to Google Artifact Registry ──────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="${{ env.GAR_REGISTRY }}/backend:${SHORT_SHA}"
          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/backend:${{ steps.image.outputs.tag }}
            ${{ env.GAR_REGISTRY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & Push Frontend to Google Artifact Registry ─────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI="${{ env.GAR_REGISTRY }}/frontend:${SHORT_SHA}"
          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/frontend:${{ steps.image.outputs.tag }}
            ${{ env.GAR_REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy directly to Production (Cloud Run) ────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: production
    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: terraform-generator-backend
          image: ${{ needs.build-backend.outputs.image }}
          region: ${{ secrets.GCP_REGION }}
          flags: |
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=5
            --port=8000
          env_vars: |
            ENVIRONMENT=production

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: terraform-generator-frontend
          image: ${{ needs.build-frontend.outputs.image }}
          region: ${{ secrets.GCP_REGION }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --port=80
          env_vars: |
            ENVIRONMENT=production

      - name: Show deployment URLs
        run: |
          echo "✅ Deployment complete!"
          BACKEND_URL=$(gcloud run services describe terraform-generator-backend --region=${{ secrets.GCP_REGION }} --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe terraform-generator-frontend --region=${{ secrets.GCP_REGION }} --format='value(status.url)')
          echo "Backend:  ${BACKEND_URL}"
          echo "Frontend: ${FRONTEND_URL}"
