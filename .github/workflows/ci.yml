name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install minimal deps for tests
        run: |
          python -m pip install --upgrade pip
          # Install only the lightweight subset needed for the smoke-test suite.
          # The full requirements (chromadb, FlagEmbedding, etc.) are too heavy
          # for a fast PR check; full integration tests run separately.
          python -m pip install \
            "fastapi==0.115.0" \
            "uvicorn==0.30.6" \
            "pydantic==2.9.2" \
            "pydantic-settings==2.5.2" \
            "python-multipart==0.0.18" \
            "sse-starlette==2.1.3" \
            "httpx==0.27.2" \
            "boto3>=1.35.0" \
            "google-genai>=1.0.0" \
            "pytest==8.3.3" \
            "pytest-asyncio==0.24.0" \
            "langgraph>=0.2.34,<0.3.0" \
            "langchain>=0.3.0,<0.4.0" \
            "pandas>=2.2.0,<3.0.0" \
            "anthropic"

      - name: Compile-check all Python files
        run: |
          # Catches NameError-style issues at import time
          python -m compileall -q backend/app

      - name: Run smoke tests
        working-directory: backend
        env:
          GEMINI_API_KEY: dummy
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
        run: pytest tests/ -q

      - name: Lint (ruff if present)
        run: |
          python -m pip install ruff==0.6.9
          ruff check backend/app || true   # advisory until ruleset is curated

      - name: pip-audit (security)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || true

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: npm audit (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
