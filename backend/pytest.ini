[pytest]
# 🟢 BEGINNER: Pytest config. Run all tests with `pytest` from the backend/ folder.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Don't pollute disk with test artefacts.
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:botocore.*
    # Python 3.13 + Starlette GZipMiddleware emits a benign "closed file" warning
    # during TestClient teardown. Not a real bug — filter so CI exit code stays 0.
    ignore::pytest.PytestUnraisableExceptionWarning

markers =
    integration: tests that hit the network or require real credentials
    slow: tests that take more than a second
